      window.storage = window.storage || {
        get: async (key) => ({ value: localStorage.getItem(key) }),
        set: async (key, value) => { localStorage.setItem(key, value); return { ok: true }; },
        delete: async (key) => { localStorage.removeItem(key); return { ok: true }; }
      };
    </script>
