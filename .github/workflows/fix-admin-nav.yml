name: Fix admin shop button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update admin navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/MarketplaceTopNav.jsx')
          s=p.read_text()
          s=s.replace('const { data } = await supabase.from("users").select("role").eq("id", session.user.id).maybeSingle();','const { data } = await supabase.from("users").select("role,shop_id").eq("id", session.user.id).maybeSingle();',1)
          old='''  const openShop = () => {\n    if (isAdmin) return;\n    if (shop) { window.dispatchEvent(new CustomEvent("pjd-open-shop", { detail: { shopId: shop.id, shop } })); return; }\n    onOpenSeller?.(null);\n  };'''
          new='''  const openShop = () => {\n    if (shop) { onOpenSeller?.(shop); return; }\n    onOpenSeller?.(null);\n  };'''
          if old not in s: raise SystemExit('openShop block not found')
          s=s.replace(old,new,1)
          old='''          {isAdmin ? (\n            <button className="pjd-action pjd-admin" onClick={() => window.dispatchEvent(new CustomEvent("pjd-open-admin"))}><ShieldCheck /><span>Administration</span></button>\n          ) : (\n            <button className="pjd-action pjd-shop" onClick={openShop}><Store /><span>{shop ? "Ma boutique" : "Créer ma boutique"}</span></button>\n          )}'''
          new='''          {isAdmin ? (\n            <>\n              <button className="pjd-action pjd-shop" onClick={openShop}><Store /><span>{shop ? "Ma boutique" : "Créer ma boutique"}</span></button>\n              <button className="pjd-action pjd-admin" onClick={() => window.dispatchEvent(new CustomEvent("pjd-open-admin"))}><ShieldCheck /><span>Administration</span></button>\n            </>\n          ) : (\n            <button className="pjd-action pjd-shop" onClick={openShop}><Store /><span>{shop ? "Ma boutique" : "Créer ma boutique"}</span></button>\n          )}'''
          if old not in s: raise SystemExit('admin render block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MarketplaceTopNav.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: admin can open own shop'
          git push
