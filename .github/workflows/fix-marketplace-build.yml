name: Fix Marketplace build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-duplicates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate openAllShops declarations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/MarketplaceHome.jsx')
          text = path.read_text(encoding='utf-8')
          line = '  const openAllShops = () => { const url = `${window.location.origin}${window.location.pathname}?pjd_shops_window=1`; window.open(url, "pjd-market-boutiques", "noopener,noreferrer"); };'
          while text.count(line) > 1:
              text = text.replace(line + '\n', '', 1)
          path.write_text(text, encoding='utf-8')
          print('openAllShops declarations:', text.count(line))
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MarketplaceHome.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: remove duplicate openAllShops declaration"
            git push origin HEAD:main
          fi
