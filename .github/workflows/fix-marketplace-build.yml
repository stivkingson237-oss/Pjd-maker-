name: Fix Marketplace build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-duplicates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicated openAllShops declarations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/MarketplaceHome.jsx')
          text = path.read_text(encoding='utf-8')
          line = '  const openAllShops = () => { const url = `${window.location.origin}${window.location.pathname}?pjd_shops_window=1`; window.open(url, "pjd-market-boutiques", "noopener,noreferrer"); };'
          count = text.count(line)
          if count > 1:
              text = text.replace(line + '\n', '')
              marker = '  const openProduct = (product) => window.dispatchEvent(new CustomEvent("pjd-open-product", { detail: { product, productId: product.id, productType: product.product_type } }));\n'
              text = text.replace(marker, marker + line + '\n', 1)
              path.write_text(text, encoding='utf-8')
              print(f'Fixed {count} duplicate declarations; kept exactly one.')
          else:
              print(f'No duplicate declaration found (count={count}).')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add src/MarketplaceHome.jsx
            git commit -m "fix: remove duplicate openAllShops declarations"
            git push origin HEAD:main
          fi
