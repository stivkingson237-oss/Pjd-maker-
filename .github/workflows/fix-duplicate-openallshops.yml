name: Fix duplicate openAllShops
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate declarations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/MarketplaceHome.jsx')
          s = p.read_text()
          lines = s.splitlines(True)
          out = []
          seen = 0
          for line in lines:
              if 'const openAllShops = () =>' in line:
                  seen += 1
                  if seen > 1:
                      continue
              out.append(line)
          p.write_text(''.join(out))
          print('openAllShops declarations:', seen)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MarketplaceHome.jsx
          git diff --cached --quiet || git commit -m "fix: remove duplicate openAllShops declaration"
          git push
