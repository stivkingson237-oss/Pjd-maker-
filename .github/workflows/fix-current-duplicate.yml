name: One-time fix current duplicate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate declaration and this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/MarketplaceHome.jsx')
          s = p.read_text()
          target = '  const openAllShops = () => { const url = `${window.location.origin}${window.location.pathname}?pjd_shops_window=1`; window.open(url, "pjd-market-boutiques", "noopener,noreferrer"); };'
          lines = s.splitlines(True)
          out = []
          seen = 0
          for line in lines:
              if line.rstrip('\n') == target:
                  seen += 1
                  if seen > 1:
                      continue
              out.append(line)
          p.write_text(''.join(out))
          Path('.github/workflows/fix-current-duplicate.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MarketplaceHome.jsx .github/workflows/fix-current-duplicate.yml
          git commit -m 'fix: remove duplicate boutiques handler'
          git push
