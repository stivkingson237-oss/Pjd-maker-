name: Apply PJD single-action navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply single-action seller pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()
          old='className="pjd-seller-space"'
          new='className={`pjd-seller-space ${sellerTab!==\'dashboard\'?\'pjd-single-action-page\':\'\'}`}'
          if 'pjd-single-action-page' not in s:
              if old not in s:
                  raise SystemExit('seller space anchor not found')
              s=s.replace(old,new,1)
              p.write_text(s)
          css=Path('src/pjd-seller-space.css')
          c=css.read_text() if css.exists() else ''
          rule='''\n/* PJD single-action navigation: secondary seller actions disappear while an action page is open. */\n.pjd-single-action-page .pjd-seller-space-nav,\n.pjd-single-action-page .pjd-seller-feature-actions,\n.pjd-single-action-page .pjd-seller-quick-actions,\n.pjd-single-action-page .pjd-seller-workspace > :first-child { display:none !important; }\n.pjd-single-action-page .seller-space-content { width:100%; max-width:100%; }\n'''
          if 'PJD single-action navigation' not in c:
              css.write_text(c.rstrip()+rule)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/pjd-seller-space.css
          git diff --cached --quiet || git commit -m "feat: isolate seller action pages"
          git push
