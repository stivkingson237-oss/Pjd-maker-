name: Fix admin shop access
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch admin shop access and duplicate handler
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/MarketplaceHome.jsx')
          s = p.read_text()
          marker = '  const openProduct = (product) => window.dispatchEvent(new CustomEvent("pjd-open-product", { detail: { product, productId: product.id, productType: product.product_type } }));\n'
          line = '  const openAllShops = () => { const url = `${window.location.origin}${window.location.pathname}?pjd_shops_window=1`; window.open(url, "pjd-market-boutiques", "noopener,noreferrer"); };'
          block = marker + line
          s, n = re.subn(r'  const openProduct = \(product\) =>[\s\S]*?(?=\n\n  if \(page === "category"\))', block, s, count=1)
          if n != 1: raise SystemExit(f'MarketplaceHome handler block not found: {n}')
          p.write_text(s)

          p = Path('src/MarketplaceTopNav.jsx')
          s = p.read_text()
          s = s.replace('const { data } = await supabase.from("users").select("role").eq("id", session.user.id).maybeSingle();', 'const { data } = await supabase.from("users").select("role,shop_id").eq("id", session.user.id).maybeSingle();', 1)
          old = '''  const openShop = () => {\n    if (isAdmin) return;\n    if (shop) { window.dispatchEvent(new CustomEvent("pjd-open-shop", { detail: { shopId: shop.id, shop } })); return; }\n    onOpenSeller?.(null);\n  };'''
          new = '''  const openShop = () => {\n    if (shop) { onOpenSeller?.(shop); return; }\n    onOpenSeller?.(null);\n  };'''
          if old not in s: raise SystemExit('TopNav openShop block not found')
          s = s.replace(old, new, 1)
          old = '''          {isAdmin ? (\n            <button className="pjd-action pjd-admin" onClick={() => window.dispatchEvent(new CustomEvent("pjd-open-admin"))}><ShieldCheck /><span>Administration</span></button>\n          ) : (\n            <button className="pjd-action pjd-shop" onClick={openShop}><Store /><span>{shop ? "Ma boutique" : "Créer ma boutique"}</span></button>\n          )}'''
          new = '''          {isAdmin ? (\n            <>\n              <button className="pjd-action pjd-shop" onClick={openShop}><Store /><span>{shop ? "Ma boutique" : "Créer ma boutique"}</span></button>\n              <button className="pjd-action pjd-admin" onClick={() => window.dispatchEvent(new CustomEvent("pjd-open-admin"))}><ShieldCheck /><span>Administration</span></button>\n            </>\n          ) : (\n            <button className="pjd-action pjd-shop" onClick={openShop}><Store /><span>{shop ? "Ma boutique" : "Créer ma boutique"}</span></button>\n          )}'''
          if old not in s: raise SystemExit('TopNav admin render block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/final-fix-openallshops.yml
          rm -f .github/workflows/fix-admin-shop.yml
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MarketplaceHome.jsx src/MarketplaceTopNav.jsx .github/workflows/final-fix-openallshops.yml .github/workflows/fix-admin-shop.yml
          git commit -m 'Fix admin access to own shop and duplicate handler'
          git push
