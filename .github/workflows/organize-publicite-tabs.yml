name: Organize Publicité tabs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder PJD Market homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/MarketplaceHome.jsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<span className="mh-eyebrow">PJD MARKET</span><h2>Découvrez les produits</h2><p>Les photos des produits défilent automatiquement.</p>','<span className="mh-eyebrow">PJD MARKET</span><h2>🔥 PRODUITS PJD MARKET</h2><p>Les photos des produits défilent automatiquement.</p>',1)
          s=s.replace('    <ProductPhotoCarousel products={products} onOpenProduct={openProduct}/>\n','',1)
          physical='<Section title="Produits physiques" eyebrow="BOUTIQUES" icon={Package} products={physical} favorites={favorites} onFavorite={favorite} onSeeAll={()=>openCategory("physical","Produits physiques")}/>'
          digital='<Section title="Produits numériques" eyebrow="DIGITAL" icon={BookOpen} products={digital} favorites={favorites} onFavorite={favorite} onSeeAll={()=>openCategory("digital","Produits numériques")}/>'
          carousel='<ProductPhotoCarousel products={products} onOpenProduct={openProduct}/>'
          s=s.replace(physical,'',1)
          s=s.replace(digital,'',1)
          anchor='<ShopsSection shops={shops} onOpenShop={(id)=>window.dispatchEvent(new CustomEvent("pjd-open-shop", {detail:{shopId:id}}))}/>'
          s=s.replace(anchor,digital+carousel+physical+anchor,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Rename and prioritize visibility tabs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/SellerGrowthHubV2.jsx')
          s=p.read_text()
          old="const tabs=[['marketing','📣 IA Marketing'],['publication','✨ IA Publication'],['analytics','📊 IA Commerciale'],['promos','🏷️ Promotions'],['ads','🚀 PJD Ads'],['referral','👥 Parrainage'],['opportunities','💡 Opportunités'],['stock','📦 Stock'],['seo','🔎 SEO']];"
          new="const tabs=[['publication','📤 Publier'],['promos','🏷️ Promotion'],['ads','📣 Publicité'],['marketing','📣 IA Marketing'],['analytics','📊 IA Commerciale'],['referral','👥 Parrainage'],['opportunities','💡 Opportunités'],['stock','📦 Stock'],['seo','🔎 SEO']];"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MarketplaceHome.jsx src/SellerGrowthHubV2.jsx
          git commit -m 'feat: reorder PJD Market homepage sections'
          git push
