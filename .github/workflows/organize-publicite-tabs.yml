name: Organize Publicité tabs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested PJD Market order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/MarketplaceHome.jsx')
          s=p.read_text()
          old='<Section title="Produits numériques" eyebrow="DIGITAL" icon={BookOpen} products={digital} favorites={favorites} onFavorite={favorite} onSeeAll={()=>openCategory("digital","Produits numériques")}/><ProductPhotoCarousel products={products} onOpenProduct={openProduct}/><Section title="Produits physiques" eyebrow="BOUTIQUES" icon={Package} products={physical} favorites={favorites} onFavorite={favorite} onSeeAll={()=>openCategory("physical","Produits physiques")}/>'
          new='<Section title="Produits numériques" eyebrow="DIGITAL" icon={BookOpen} products={digital} favorites={favorites} onFavorite={favorite} onSeeAll={()=>openCategory("digital","Produits numériques")}/><Section title="Produits physiques" eyebrow="BOUTIQUES" icon={Package} products={physical} favorites={favorites} onFavorite={favorite} onSeeAll={()=>openCategory("physical","Produits physiques")}/><ProductPhotoCarousel products={products} onOpenProduct={openProduct}/>'
          if old not in s:
              print('Target already changed or not found; nothing to do')
          else:
              p.write_text(s.replace(old,new,1))
          PY
      - name: Commit target only and restore this workflow
        shell: bash
        run: |
          git checkout HEAD -- .github/workflows/organize-publicite-tabs.yml
          if git diff --quiet -- src/MarketplaceHome.jsx; then echo 'No target changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MarketplaceHome.jsx
          git commit -m 'fix: swap PJD Market carousel and physical products'
          git push
