name: Final fix openAllShops
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate openAllShops declarations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/MarketplaceHome.jsx')
          lines=p.read_text(encoding='utf-8').splitlines(True)
          target='  const openAllShops = () => { const url = `${window.location.origin}${window.location.pathname}?pjd_shops_window=1`; window.open(url, "pjd-market-boutiques", "noopener,noreferrer"); };\n'
          out=[]
          seen=0
          for line in lines:
              if line == target:
                  seen += 1
                  if seen > 1:
                      continue
              out.append(line)
          p.write_text(''.join(out), encoding='utf-8')
          print('openAllShops declarations:', seen)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-fix-openallshops.yml
          git add src/MarketplaceHome.jsx
          git commit -m "fix: remove duplicate openAllShops declaration"
          git push