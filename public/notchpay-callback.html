<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retour paiement — PJD Market</title>
</head>
<body>
<p>Retour vers PJD Market…</p>
<script>
(function(){
  var q=new URLSearchParams(window.location.search);
  var out=new URLSearchParams();
  out.set('notchpay','1');
  ['reference','transaction','trxref','order_id'].forEach(function(k){
    var v=q.get(k);
    if(v) out.set(k,v);
  });
  window.location.replace('/?'+out.toString());
})();
</script>
</body>
</html>
